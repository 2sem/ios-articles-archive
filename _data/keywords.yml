# Canonical keyword taxonomy for the archive.
#
# `scripts/keywords.rb` uses this file to:
#   1. auto-assign keywords to articles that don't declare any, and
#   2. normalize hand-written keywords (e.g. "async/await" -> "Concurrency").
#
# Each entry:
#   name:     canonical keyword shown on the site
#   aliases:  phrases that indicate the topic, matched on word boundaries.
#             The name itself is always an alias. Matching is
#             case-insensitive, except for single-word aliases containing an
#             uppercase letter (code identifiers like `Task`, `DI`, `UIView`),
#             which must match exactly to avoid false positives.
#             Korean aliases work with particles attached ("모듈화를" matches 모듈화).
#
# Add new topics here — no code change needed.

