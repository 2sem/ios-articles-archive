---
layout: default
title: Search
---
<section class="hero">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</section>

<form id="search" class="search" role="search" data-index="{{ '/search.json' | relative_url }}" onsubmit="return false">
  <div class="search-row">
    <label class="visually-hidden" for="q">Search</label>
    <input id="q" name="q" type="search" placeholder='Search — e.g. actor reentrancy, "retain cycle"' autocomplete="off" autofocus>
    <kbd class="hint" aria-hidden="true">/</kbd>
  </div>

  <div class="filters">
    <div class="filter">
      <label for="from">From</label>
      <input id="from" name="from" type="date">
    </div>
    <div class="filter">
      <label for="to">To</label>
      <input id="to" name="to" type="date">
    </div>
    <div class="filter presets" role="group" aria-label="Date presets">
      <button type="button" data-preset="30">30 days</button>
      <button type="button" data-preset="365">1 year</button>
      <button type="button" data-preset="all">Any time</button>
    </div>
    <div class="filter">
      <label for="kind">Type</label>
      <select id="kind" name="kind">
        <option value="">All</option>
        <option value="article">Articles</option>
        <option value="handbook">Handbook</option>
      </select>
    </div>
    <div class="filter">
      <label for="sort">Sort</label>
      <select id="sort" name="sort">
        <option value="">Relevance</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>
  </div>

  <div id="facets" class="facets" aria-label="Filter by keyword"></div>
</form>

<p id="status" class="status" role="status" aria-live="polite">Loading index…</p>
<ol id="results" class="results"></ol>

<noscript>
  <p>Search needs JavaScript. Browse the <a href="{{ '/articles/' | relative_url }}">articles</a>,
  the <a href="{{ '/handbook/' | relative_url }}">handbook</a>, or
  <a href="{{ '/keywords/' | relative_url }}">keywords</a> instead.</p>
</noscript>

<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
