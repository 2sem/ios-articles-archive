name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commits keywords generated at deploy time
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Safety net for entries pushed straight to main: fill in missing keywords
      # for this build and commit them. (Pull requests get them from entries.yml.)
      - name: Assign missing keywords
        run: ruby scripts/keywords.rb

      - name: Commit keywords
        # A protected main may reject the push; the build still publishes the keywords.
        continue-on-error: true
        run: |
          git add _articles _handbook
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Assign keywords to archive entries"
          git push

      # Never blocks a deploy; just makes a missing translation visible in the run.
      - name: Report missing Korean translations
        run: ruby scripts/translations.rb --check || echo "::warning::Some entries lack a current Korean translation."

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
