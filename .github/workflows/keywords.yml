name: Keywords

# Assigns keywords to new or edited entries from _data/keywords.yml and
# commits them back to the pull request branch.

on:
  pull_request:
    paths:
      - "_articles/**"
      - "_handbook/**"
      - "_data/keywords.yml"
      - "scripts/keywords.rb"

permissions:
  contents: write

concurrency:
  group: keywords-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  keywords:
    runs-on: ubuntu-latest
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Preview keyword changes
        run: |
          {
            echo "### Keywords"
            echo '```'
            ruby scripts/keywords.rb --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit keywords to the branch
        if: env.SAME_REPO == 'true'
        run: |
          ruby scripts/keywords.rb
          if git diff --quiet; then
            echo "Keywords already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Assign keywords to archive entries"
          git push

      # Workflows can't push to forks: ask the contributor to run the script instead.
      - name: Check keywords (forks)
        if: env.SAME_REPO != 'true'
        run: |
          ruby scripts/keywords.rb --check || {
            echo "::error::Some entries need keywords. Run 'ruby scripts/keywords.rb' locally and push the result."
            exit 1
          }
