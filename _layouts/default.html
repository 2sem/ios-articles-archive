<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9f0a'/%3E%3Cstop offset='.55' stop-color='%23ff375f'/%3E%3Cstop offset='1' stop-color='%230a84ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>{{ site.title }}
      </a>
      <nav class="site-nav" aria-label="Main">
        {% assign here = page.url %}
        <a href="{{ '/' | relative_url }}"{% if here == '/' %} aria-current="page"{% endif %}>Search</a>
        <a href="{{ '/articles/' | relative_url }}"{% if here == '/articles/' %} aria-current="page"{% endif %}>Articles</a>
        <a href="{{ '/handbook/' | relative_url }}"{% if here == '/handbook/' %} aria-current="page"{% endif %}>Handbook</a>
        <a href="{{ '/keywords/' | relative_url }}"{% if here == '/keywords/' %} aria-current="page"{% endif %}>Keywords</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a href="https://github.com/{{ site.repository }}">GitHub</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
      <a href="https://github.com/{{ site.repository }}/blob/main/CONTRIBUTING.md">Add an article</a>
    </div>
  </footer>
</body>
</html>
