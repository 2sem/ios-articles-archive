name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commits translations/keywords generated at deploy time
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Safety net for entries that reached main without going through entries.yml
      # (direct pushes, fork PRs, or a missing API key at PR time): translate and tag
      # them now, publish them in this build, and commit them so it's a one-time cost.
      - name: Translate to Korean
        run: bundle exec ruby scripts/translate.rb
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Assign missing keywords
        run: bundle exec ruby scripts/keywords.rb

      - name: Commit generated files
        # A protected main may reject the push; the build still publishes the files.
        continue-on-error: true
        run: |
          git add _articles _handbook
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive Korean translations and keywords"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
